name: Amythest APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - packaging/android/**
      - packaging/icons/**
      - .github/workflows/amythest-apk.yml
      - .github/workflows/android.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src/**

permissions:
  contents: read

concurrency:
  group: amythest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Amythest Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CINNABAR_ANDROID_PROFILE: play
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout Amythest
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK and NDK
        run: |
          pin() { python3 -c 'import json,sys; print(json.load(open("packaging/android/runtime.json"))[sys.argv[1]])' "$1"; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-$(pin target_sdk)" "build-tools;$(pin build_tools)" "ndk;$(pin ndk)"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$(pin cargo_ndk)" --locked
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build APK
        run: bash packaging/android/build-apk.sh
      - name: Verify APK exists
        run: test -s target/android/*-arm64-v8a.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Amythest-Android-APK
          path: target/android/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
